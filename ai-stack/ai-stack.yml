# AI/streaming layer — deliberately separate from Wazuh's compose file so the
# Wazuh base stack stays pristine and independently restartable. Everything
# after Wazuh runs here as a service: Kafka, Filebeat (Wazuh -> Kafka), the two
# detectors, the auth lane's Morpheus pipeline (GPU) and the API + console.
# `up -d --build` starts it all; there are no processes to launch by hand.

# Shared by api / auth-detector / web-detector: one image (../Dockerfile), run
# three ways. Host networking, like Filebeat: Kafka advertises localhost, and
# every address in dashboard/.env (OpenSearch, Wazuh API, Ollama on
# localhost:<port>) works unchanged. The .env is mounted read-only — edit it,
# then `restart` the service. Missing .env = refuse to start (create_host_path).
x-ai-xdr: &ai-xdr
  build:
    context: ..
  image: luckyfive/ai-xdr
  restart: unless-stopped
  network_mode: host
  volumes:
    - type: bind
      source: ../dashboard/.env
      target: /app/dashboard/.env
      read_only: true
      bind:
        create_host_path: false
  logging:                               # docker keeps logs forever by default
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      # Host port is configurable because the SIAM VM is shared: another group's
      # broker may already hold 9092, and a host port can only bind once no
      # matter what the containers are named. Container-side port matches so the
      # advertised address stays correct (see KAFKA_ADVERTISED_LISTENERS).
      - "${KAFKA_HOST_PORT:-9092}:${KAFKA_HOST_PORT:-9092}"
    environment:
      # --- KRaft: this node is both broker and controller (no ZooKeeper) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- listeners ---
      # CONTROLLER stays on 9093: it is internal only (never published), and
      # changing it would not match KAFKA_CONTROLLER_QUORUM_VOTERS recorded in
      # the existing metadata log.
      KAFKA_LISTENERS: PLAINTEXT://:${KAFKA_HOST_PORT:-9092},CONTROLLER://:9093
      # Must equal the port clients dial, or Kafka redirects them elsewhere
      # after the initial connection.
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      # --- single-node: no replication available ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- keep it small; RAM is the constraint on this VM ---
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Wazuh -> Kafka: ships every event from the manager's archive into the
  # wazuh-archives topic. Config and reasoning: filebeat/filebeat.yml.
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    restart: unless-stopped
    user: root                       # to read the manager's files whatever uid owns them
    # -e: log to `docker logs`; strict.perms off because the mounted config is
    # owned by the host user, not root
    command: ["filebeat", "-e", "--strict.perms=false"]
    network_mode: host               # Kafka advertises localhost:<port>
    environment:
      KAFKA_HOST_PORT: ${KAFKA_HOST_PORT:-9092}
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - wazuh_logs:/var/ossec/logs:ro
      - filebeat_data:/usr/share/filebeat/data    # registry: how far it has read
    depends_on:
      - kafka

  # Kafka -> model -> ai-detections-*. Isolation Forest only in this image: the
  # autoencoder / Morpheus models need torch + GPU (SETUP.md §7), so keep
  # DETECTOR_MODEL unset or isolation_forest for these containers.
  auth-detector:
    <<: *ai-xdr
    working_dir: /app/ai-stack/pipeline
    command: ["python", "detection_consumer.py"]
    depends_on:
      - kafka

  # web lane, on its own Kafka consumer group (see the module docstring)
  web-detector:
    <<: *ai-xdr
    working_dir: /app/ai-stack/pipeline
    command: ["python", "web_detection_consumer.py"]
    depends_on:
      - kafka

  # API + the built console, one port: http://<host>:8000
  api:
    <<: *ai-xdr
    working_dir: /app/dashboard
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:                         # shows (healthy) in `docker ps`
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The auth lane again, as an NVIDIA Morpheus pipeline (morpheus/auth_pipeline.py):
  # Kafka -> windows -> dfencoder on the GPU -> ai-detections-* tagged
  # "pipeline": "morpheus". Its own consumer group, so auth-detector (the CPU
  # baseline) keeps receiving every event. Runs the VM's Morpheus conda env,
  # mounted read-only at its own path (see morpheus/Dockerfile). --cpu = Morpheus
  # CPU mode for the dataframe stages (pandas): cuDF crashes inside Morpheus's
  # worker threads on this driver (failure log Entry 41); dfencoder still uses the GPU.
  morpheus-auth:
    <<: *ai-xdr
    build:
      context: ..
      dockerfile: ai-stack/morpheus/Dockerfile
    image: luckyfive/morpheus-auth
    init: true                           # PID 1 that forwards docker stop to Python
    working_dir: /app/ai-stack/morpheus
    command: ["${MORPHEUS_CONDA:-/LuckyFive/miniforge3}/envs/morpheus/bin/python", "auth_pipeline.py", "--cpu"]
    volumes:
      - type: bind
        source: ../dashboard/.env
        target: /app/dashboard/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MORPHEUS_CONDA:-/LuckyFive/miniforge3}
        target: ${MORPHEUS_CONDA:-/LuckyFive/miniforge3}
        read_only: true
        bind:
          create_host_path: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - kafka

volumes:
  kafka_data:
  filebeat_data:
  # The Wazuh manager's log volume, created by the Wazuh compose project as
  # <project>_wazuh_logs. Naming it explicitly pins Filebeat to OUR manager on
  # the shared VM: a wrong name fails `up` instead of reading another group's.
  # So bring Wazuh up first.
  wazuh_logs:
    external: true
    name: ${WAZUH_LOGS_VOLUME:-luckyfive_wazuh_wazuh_logs}
